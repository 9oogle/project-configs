spring:
  jpa:
    hibernate:
      ddl-auto: update          # 로컬은 자동 스키마 갱신
    show-sql: true              # 로컬은 SQL 보기

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:goggles}
    username: ${DB_USERNAME:goggles}
    password: ${DB_PASSWORD:goggles}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 20MB

server:
  port: 9012

# 로컬은 기본 local 스토리지
file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9012}
  local:
    base:
      path: ${FILE_BASE_PATH:./storage/files}
      url: ${FILE_BASE_URL:/upload/}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  tracing:
    sampling:
      probability: 0.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans