spring:
  profiles:
    group:
      dev: "kafka"
      prod: "kafka"

  jpa:
    properties:
      hibernate:
        default_schema: order_db
    generate-ddl: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

      lecture-service:
        connectTimeout: 3000
        readTimeout: 8000

      mentoring-service:
        connectTimeout: 3000
        readTimeout: 8000

resilience4j:
  circuitbreaker:
    configs:
      default-read:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        slowCallDurationThreshold: 3s
        slowCallRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.net.SocketTimeoutException
          - feign.FeignException.InternalServerError
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - feign.RetryableException
        ignoreExceptions:
          - com.goggles.common.exception.BadRequestException
          - com.goggles.common.exception.ConflictException
          - com.goggles.common.exception.ForbiddenException
          - com.goggles.common.exception.NotFoundException
          - com.goggles.common.exception.UnAuthorizedException
          - org.springframework.web.bind.MethodArgumentNotValidException
          - jakarta.validation.ConstraintViolationException
          - org.springframework.http.converter.HttpMessageNotReadableException
          - java.lang.IllegalArgumentException

      default-write:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 30
        waitDurationInOpenState: 60s
        slowCallDurationThreshold: 3s
        slowCallRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.net.SocketTimeoutException
          - feign.FeignException.InternalServerError
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - feign.RetryableException
        ignoreExceptions:
          - com.goggles.common.exception.BadRequestException
          - com.goggles.common.exception.ConflictException
          - com.goggles.common.exception.ForbiddenException
          - com.goggles.common.exception.NotFoundException
          - com.goggles.common.exception.UnAuthorizedException
          - org.springframework.web.bind.MethodArgumentNotValidException
          - jakarta.validation.ConstraintViolationException
          - org.springframework.http.converter.HttpMessageNotReadableException
          - java.lang.IllegalArgumentException

      default-rollback:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 30
        waitDurationInOpenState: 60s
        slowCallDurationThreshold: 3s
        slowCallRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.net.SocketTimeoutException
          - feign.FeignException.InternalServerError
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - feign.RetryableException
        ignoreExceptions:
          - com.goggles.common.exception.BadRequestException
          - com.goggles.common.exception.ConflictException
          - com.goggles.common.exception.ForbiddenException
          - com.goggles.common.exception.NotFoundException
          - com.goggles.common.exception.UnAuthorizedException
          - org.springframework.web.bind.MethodArgumentNotValidException
          - jakarta.validation.ConstraintViolationException
          - org.springframework.http.converter.HttpMessageNotReadableException
          - java.lang.IllegalArgumentException

  timelimiter:
    configs:
      default-read:
        timeout-duration: 3s
        cancel-running-future: true
      default-write:
        timeout-duration: 10s
        cancel-running-future: true
      default-rollback:
        timeout-duration: 5s
        cancel-running-future: true

    instances:
      lecture-service-write:
        baseConfig: default-write
      mentoring-service-write:
        baseConfig: default-write
      lecture-service-cancel:
        baseConfig: default-write
      mentoring-service-cancel:
        baseConfig: default-write
      lecture-service-rollback:
        baseConfig: default-rollback
      mentoring-service-rollback:
        baseConfig: default-rollback
      user-service-read:
        baseConfig: default-read

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - java.net.SocketTimeoutException
          - feign.FeignException.InternalServerError
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - feign.RetryableException
        ignoreExceptions:
          - com.goggles.common.exception.BadRequestException
          - com.goggles.common.exception.ConflictException
          - com.goggles.common.exception.ForbiddenException
          - com.goggles.common.exception.NotFoundException
          - com.goggles.common.exception.UnAuthorizedException
          - org.springframework.web.bind.MethodArgumentNotValidException
          - jakarta.validation.ConstraintViolationException
          - org.springframework.http.converter.HttpMessageNotReadableException
          - java.lang.IllegalArgumentException

      default-rollback:
        maxAttempts: 2
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - java.net.SocketTimeoutException
          - feign.FeignException.InternalServerError
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - feign.RetryableException
        ignoreExceptions:
          - com.goggles.common.exception.BadRequestException
          - com.goggles.common.exception.ConflictException
          - com.goggles.common.exception.ForbiddenException
          - com.goggles.common.exception.NotFoundException
          - com.goggles.common.exception.UnAuthorizedException
          - org.springframework.web.bind.MethodArgumentNotValidException
          - jakarta.validation.ConstraintViolationException
          - org.springframework.http.converter.HttpMessageNotReadableException
          - java.lang.IllegalArgumentException

    instances:
      lecture-service-write:
        baseConfig: default
      mentoring-service-write:
        baseConfig: default
      lecture-service-cancel:
        baseConfig: default
      mentoring-service-cancel:
        baseConfig: default
      lecture-service-rollback:
        baseConfig: default-rollback
      mentoring-service-rollback:
        baseConfig: default-rollback
      user-service-read:
        baseConfig: default

server:
  port: 9007

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: refresh, health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}"

springdoc:
  version: '1.0.0'
