spring:
  application:
    name: user-service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: users

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "${KEYCLOAK_URL:http://keycloak:8080}/realms/${KEYCLOAK_REALM:goggles}/protocol/openid-connect/certs"
          issuer-uri: "${KEYCLOAK_URL:http://keycloak:8080}/realms/${KEYCLOAK_REALM:goggles}"

# 키클록 설정
keycloak:
  server-url: ${KEYCLOAK_URL:http://keycloak:8080}
  realm: ${KEYCLOAK_REALM:goggles}
  client-id: ${KEYCLOAK_CLIENT_ID:goggles-app}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

# 로그 설정
logging:
  level:
    org.hibernate.type: trace
    org.hibernate.orm.jdbc.bind: trace

server:
  port: 9010

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
